<html lang="en">
<head>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7HJCT0LDMJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-7HJCT0LDMJ');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Curriculum Vitae — Ilayda B. Onder</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body{
      margin:0;
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", serif;
      background:#fff;
      color:#000;
      line-height:1.5;
      font-size:14.5px;
    }

    nav{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      border-bottom:1px solid #ccc;
      padding:10px 0;
    }

    nav a{
      margin:5px 15px;
      text-decoration:none;
      color:#808080;
      padding-bottom:5px;
      font-size:18px;
    }

    nav a:hover,
    nav a.active{
      border-bottom:2px solid #800000;
      color:#800000;
      font-weight:bold;
    }

    .page{
      max-width: 1000px;
      margin: 35px auto;
      padding: 0 20px;
      box-sizing:border-box;
    }

    .two-col{
      display:flex;
      gap:28px;
      align-items:flex-start;
    }

    .left{
      flex: 0 0 260px;
      text-align:center;
    }

    .card{
      border:1px solid #e6e6e6;
      border-radius:10px;
      padding:18px;
      box-sizing:border-box;
    }

    .left .card{
      max-width:240px;
      margin:0 auto;
    }

    .profile{
      width: 180px;
      height: 180px;
      object-fit:cover;
      border-radius:50%;
      border:1px solid #e6e6e6;
    }

    h1.name{
      font-size:20px;
      font-weight:700;
      margin:14px 0 6px 0;
    }

    .titleblock{
      font-size:14.5px;
      line-height:1.4;
      margin:0;
      color:#444;
      text-align:center;
    }

    .icons{
      margin-top:12px;
      font-size:18px;
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:12px;
    }

    .icons a{
      color:#000;
      text-decoration:none;
    }

    .icons a:hover{
      color:#800000;
    }

    .right{
      flex: 1 1 auto;
      min-width: 0;
    }

    /* Desktop/large screens: embedded PDF */
    .cv-box{
      width:100%;
      height:1050px;
      border:1px solid #e6e6e6;
      border-radius:10px;
      overflow:hidden;
      background:#fff;
    }

    .cv-frame{
      width:100%;
      height:100%;
      border:0;
    }

    /* Mobile fallback card */
    .cv-mobile{
      display:none;
      border:1px solid #e6e6e6;
      border-radius:10px;
      padding:18px;
      box-sizing:border-box;
      background:#fff;
    }

    .cv-mobile p{
      margin:0 0 12px 0;
      color:#444;
      font-size:13px;
      line-height:1.4;
    }

    .cv-btn{
      display:inline-block;
      padding:10px 14px;
      border:1px solid #800000;
      border-radius:10px;
      color:#800000;
      font-weight:bold;
      text-decoration:none;
      font-size:14px;
    }

    .cv-btn:hover{
      background:#800000;
      color:#fff;
    }

    a{
      color:#800000;
      font-weight:bold;
      text-decoration:none;
    }

    footer{
      text-align:center;
      font-size:11px;
      margin:40px 0 20px 0;
      color:#999;
    }

    @media (max-width: 800px){
      .two-col{
        flex-direction:column;
        align-items:center;
      }

      .left{
        flex:none;
        width:100%;
        max-width:420px;
      }

      .left .card{
        max-width:320px;
      }

      .right{
        width:100%;
      }

      /* Prefer native PDF viewer on mobile */
      .cv-box{ display:none; }
      .cv-mobile{ display:block; }
    }

    @media (max-width: 600px){
      .page{
        margin:20px auto;
      }

      nav a{
        margin:5px 10px;
        font-size:16px;
      }

      .left .card{
        max-width:100%;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="cv.html" class="active">CV</a>
    <a href="publications.html">Publications</a>
    <a href="ongoing.html">Ongoing Projects</a>
    <a href="data.html">Datasets</a>
    <a href="teaching.html">Teaching</a>
  </nav>

  <main class="page">
    <div class="two-col">
      <aside class="left">
        <div class="card">
          <img src="profile.webp" alt="Ilayda Onder" class="profile" />
          <h1 class="name">Ilayda B. Onder</h1>
          <p class="titleblock">
            Assistant Professor<br>
            Department of Political Science<br>
            Texas A&amp;M University
          </p>

          <div class="icons" aria-label="Links">
            <a href="mailto:ilaydaonder@tamu.edu" target="_blank" rel="noopener"><i class="fas fa-envelope"></i></a>
            <a href="https://scholar.google.com/citations?user=FDoBqPgAAAAJ&hl=en" target="_blank" rel="noopener"><i class="fas fa-graduation-cap"></i></a>
            <a href="https://orcid.org/0000-0002-5712-8131" target="_blank" rel="noopener"><i class="fab fa-orcid"></i></a>
            <a href="https://www.linkedin.com/in/ilayda-onder-b7a522287/" target="_blank" rel="noopener"><i class="fab fa-linkedin"></i></a>
            <a href="https://x.com/ilaydaonder" target="_blank" rel="noopener"><i class="fab fa-x-twitter"></i></a>
            <a href="https://bsky.app/profile/ilaydaonder.bsky.social" target="_blank" rel="noopener"><i class="fas fa-globe"></i></a>
          </div>
        </div>
      </aside>

      <section class="right">
        <!-- Desktop/tablet embed -->
        <div class="cv-box">
          <iframe class="cv-frame" src="cv.pdf" title="Curriculum Vitae PDF"></iframe>
        </div>

        <!-- Mobile: native PDF viewer link (reliable scrolling) -->
        <div class="cv-mobile">
          <a class="cv-btn" href="cv.pdf" target="_blank" rel="noopener">CV (PDF)</a>
        </div>
      </section>
    </div>
  </main>

  <footer>
    &copy; 2025 Ilayda B. Onder
  </footer>
</body>
</html>
